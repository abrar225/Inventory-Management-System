{% comment %}
  Inline flash messages for auth pages. Errors appear inline (never popups),
  per the design system. Colors map to the message tags configured in
  settings.MESSAGE_TAGS.
{% endcomment %}
{% if messages %}
  <div class="mb-md space-y-2">
    {% for message in messages %}
      <div
        role="alert"
        class="rounded-md border px-md py-2 text-small
          {% if message.tags == 'success' %}border-success/30 bg-success/10 text-success
          {% elif message.tags == 'warning' %}border-warning/30 bg-warning/10 text-warning
          {% elif message.tags == 'error' %}border-danger/30 bg-danger/10 text-danger
          {% else %}border-info/30 bg-info/10 text-info{% endif %}"
      >
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
